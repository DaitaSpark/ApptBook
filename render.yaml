services:
  - type: web
    name: jrco-appointments
    runtime: static
    buildCommand: python build_static.py
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /config.json
        name: Cache-Control
        value: no-store
      - path: /admin.html
        name: Cache-Control
        value: no-store
    routes:
      - type: redirect
        source: /admin
        destination: /admin.html
      - type: redirect
        source: /admin/login
        destination: /admin.html
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
