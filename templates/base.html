<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Appointments{% endblock %} · JR & Co.</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">JR <span>&</span> Co.<small>APPOINTMENTS</small></a><nav><a href="{{ url_for('index') }}">Book a meeting</a><a href="{{ url_for('admin') }}">Admin</a></nav></header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>JR & Co. <span>Make time for what matters.</span></footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
