<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Appointments{% endblock %} · JR & Co.</title><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="top-strip">JR & CO. <span>APPOINTMENTS</span></div><header><a class="brand" href="{{ url_for('index') }}" aria-label="JR & Co. appointments home"><img src="{{ url_for('static', filename='brand/jrco-logo.png') }}" alt="JR & Co." width="70" height="80"><small>APPOINTMENTS</small></a><nav aria-label="Main navigation"><a href="{{ url_for('index') }}">Book a meeting</a><a href="https://jrcogolf.com/">Visit our shop ↗</a><a href="{{ url_for('admin') }}">Admin</a></nav></header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer><a href="https://jrcogolf.com/">JR & Co.</a> <span>Find your next time to connect.</span></footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
